{% extends 'moments/base.html' %}

{% block title %}页面未找到 - 404{% endblock %}

{% block content %}
<div class="container">
    <div class="error-container">
        <div class="error-code">404</div>
        <h2 class="error-message">😕 抱歉，您访问的页面不存在</h2>
        <p class="error-details">
            可能是页面已被删除、移动，或者 URL 输入有误。
        </p>
        <div>
            <a href="{% url 'moments:moments_list' %}"
               class="btn btn-primary btn-lg">
                <i class="fas fa-home"></i> 返回知识堂
            </a>
            <a href="javascript:history.back()"
               class="btn btn-secondary btn-lg ms-3">
                <i class="fas fa-arrow-left"></i> 返回上一页
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .error-container {
        text-align: center;
        padding: 50px 0;
        max-width: 600px;
        margin: 0 auto;
    }
    .error-code {
        font-size: 8rem;
        font-weight: bold;
        color: #dc3545;
        margin-bottom: 20px;
    }
    .error-message {
        font-size: 1.5rem;
        margin-bottom: 30px;
    }
    .error-details {
        color: #6c757d;
        margin-bottom: 40px;
    }
</style>
{% endblock %}
